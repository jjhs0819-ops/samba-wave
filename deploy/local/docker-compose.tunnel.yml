# 전부-터널 구성 — 백엔드 모든 아웃바운드가 WireGuard 컨테이너 거쳐 GCP 정적IP로 나감.
# 마켓 IP 화이트리스트/CDN 변동 문제 영구 해결 (마이그레이션 전처럼 전부 정적IP).
# 집 본체(ABC 데몬 스크래핑)는 영향 없음 — 컨테이너만 터널.
#
# 전제: 집 호스트 WireGuard 서비스(samba-wg) 중지 상태여야 함 (10.8.0.2 중복 방지).
# 사용: $env:BG_DISABLE='0'; docker compose --env-file local.env -f docker-compose.tunnel.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # /dev/shm 기본 64MB → 1GB. 병렬쿼리 shared temp 부족 시 DiskFullError로
    # 큰 쿼리(전체 상품 스캔 등) 실패하던 것 방지 (2026-07-03)
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-samba}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?LOCAL_DB_PASSWORD 필요}
      POSTGRES_DB: ${LOCAL_DB_NAME:-samba}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: ["postgres", "-c", "max_connections=400", "-c", "shared_buffers=2GB"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks: [samba-local]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-samba}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # WireGuard 게이트웨이 — api/worker 가 이 netns 공유. AllowedIPs=0.0.0.0/0(wg/wg0.conf)
  # → samba-local(172.x) 빼고 전부 터널. 인바운드(GCP→10.8.0.2:8080)도 이 컨테이너가 받음.
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./wg:/config/wg_confs
    ports:
      - "127.0.0.1:8080:8080" # 로컬 헬스체크용 (인바운드는 10.8.0.2 직접)
    networks: [samba-local]
    restart: unless-stopped

  samba-api:
    image: local-samba-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      wireguard:
        condition: service_started
    network_mode: "service:wireguard"
    env_file: [./local.env]
    environment:
      ENVIRONMENT: production
      DB_SSL_REQUIRED: "false"
      WRITE_DB_HOST: postgres
      WRITE_DB_PORT: "5432"
      READ_DB_HOST: postgres
      READ_DB_PORT: "5432"
      WEB_CONCURRENCY: "1"
      PROCESS_ROLE: api
      # 크림 섀도는 전용 프로세스(samba-kream, PROCESS_ROLE=kream)로 분리 — api 격리(503 방지)
      WORKER_EXCLUDE_TYPES: "transmit,autotune_transmit,order_sync"
      AUTOTUNE_TRANSMIT_VIA_QUEUE: "1"
      AUTOTUNE_QUEUE_CAP: "0"
      AUTOTUNE_QUEUE_CAP_PER_MARKET: "0"
      DISABLE_BACKGROUND_WORKERS: "${BG_DISABLE:-1}"

  samba-worker:
    image: local-samba-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      wireguard:
        condition: service_started
    network_mode: "service:wireguard"
    env_file: [./local.env]
    environment:
      ENVIRONMENT: production
      DB_SSL_REQUIRED: "false"
      WRITE_DB_HOST: postgres
      WRITE_DB_PORT: "5432"
      READ_DB_HOST: postgres
      READ_DB_PORT: "5432"
      PROCESS_ROLE: worker
      WORKER_ONLY_TYPES: "transmit,autotune_transmit,order_sync"
      # 8코어 활용 — worker 8개. 프로세스당 풀 축소(write 20, read 10 = 30)로
      # 8×30 + api(80) = 320 < max_connections 400 안에 들어옴.
      WORKER_REPLICAS: "8"
      # order_sync(계정 3병렬)+오토튠+transmit 동시 점유로 20 풀 고갈 → 30으로 상향.
      # 8 replica × 30 = 240 < 집 Postgres max_connections=400 (api~60+reconciler 여유).
      DB_WRITE_POOL_SIZE: "15"
      DB_WRITE_MAX_OVERFLOW: "15"
      DB_READ_POOL_SIZE: "5"
      DB_READ_MAX_OVERFLOW: "5"
      # 오토튠 bg 전송 동시성 300 → 20. 풀(30) 초과로 270개 timeout 나던 것 차단.
      # order_sync·오토튠 여유분 남기고 풀 안에서 안정 처리.
      JOB_BG_TRANSMIT_MAX_CONCURRENCY: "20"
      # api 와 같은 netns(service:wireguard) 공유 → 8080 충돌 방지 위해 worker 는 8081
      WORKER_BIND_PORT: "8081"
      DISABLE_BACKGROUND_WORKERS: "${BG_DISABLE:-1}"
      # #542 쿠팡 대량전송 self-deadlock 방지 — 즉시저장 별도세션 스킵.
      # 최종 writeback 이 registered_accounts/product_no 기록하므로 손실 없음.
      DISABLE_IMMEDIATE_SAVE: "1"

  # Cloudflare Tunnel 로컬 Caddy — /images/* R2 프록시 + samba-api 역프록시
  # Cloudflare가 TLS 처리하므로 HTTP 80포트만 운용
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: [./local.env]
    networks: [samba-local]
    depends_on:
      wireguard:
        condition: service_started

  # Cloudflare Tunnel 클라이언트 — cloudflared-samba 독립 컨테이너 대체
  # 터널 토큰은 local.env CLOUDFLARE_TUNNEL_TOKEN 에 저장
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # protocol http2 강제 — QUIC(UDP 7844)가 집 네트워크에서 handshake timeout 반복
    # (error 1033 flapping)이라 TCP(http2)로 고정해 터널 안정화.
    command: ["tunnel", "--no-autoupdate", "run", "--protocol", "http2", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    networks: [samba-local]
    depends_on:
      caddy:
        condition: service_started

  # 유지보수 루프 전용 프로세스(C) — 고스트 리컨실러/송장sweep/soldout 정리.
  # 단일 인스턴스(중복 리컨실 방지). api(A) 이벤트루프 과부하 → HTTP 503 분리용.
  samba-reconciler:
    image: local-samba-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      wireguard:
        condition: service_started
    network_mode: "service:wireguard"
    env_file: [./local.env]
    environment:
      ENVIRONMENT: production
      DB_SSL_REQUIRED: "false"
      WRITE_DB_HOST: postgres
      WRITE_DB_PORT: "5432"
      READ_DB_HOST: postgres
      READ_DB_PORT: "5432"
      PROCESS_ROLE: reconciler
      # 유지보수 루프는 반드시 돌아야 하므로 BG 비활성 금지 (0 고정)
      DISABLE_BACKGROUND_WORKERS: "0"
      # netns 공유 → api(8080)/worker(8081)와 분리
      RECONCILER_BIND_PORT: "8082"
      # 풀 축소 — api(80)+worker(8×30=240)+reconciler(30)=350 < max_connections(400)
      DB_WRITE_POOL_SIZE: "10"
      DB_WRITE_MAX_OVERFLOW: "10"
      DB_READ_POOL_SIZE: "5"
      DB_READ_MAX_OVERFLOW: "5"

  # 크림 오토튠 전용 프로세스(2세대 리셀) — 스니덩크 원가·재고 전수순회 → 크림 입찰
  # 갱신+리스톡+삭제 통합 루프. 28k 전수스캔이 무거워 api(HTTP 503)·worker(전송)와 격리.
  # 단일 인스턴스(중복 입찰 방지). KREAM_SHADOW=1=섀도(로그만), KREAM_SHADOW_EXECUTE 미설정=하드오프.
  samba-kream:
    image: local-samba-api
    restart: unless-stopped
    # py-spy 스택 덤프용(루프 행 원인 진단). ptrace 권한 필요. [2026-08-01]
    cap_add: [SYS_PTRACE]
    depends_on:
      postgres:
        condition: service_healthy
      wireguard:
        condition: service_started
    network_mode: "service:wireguard"
    env_file: [./local.env]
    environment:
      ENVIRONMENT: production
      DB_SSL_REQUIRED: "false"
      WRITE_DB_HOST: postgres
      WRITE_DB_PORT: "5432"
      READ_DB_HOST: postgres
      READ_DB_PORT: "5432"
      PROCESS_ROLE: kream
      KREAM_SHADOW: "1"  # 섀도 모드 — target 계산·로그만, 실제 입찰 쓰기 없음(하드오프)
      KREAM_UNIFIED: "1"  # [Step 3] 스니덩크 전수순회 통합(갱신+리스톡+삭제). 미설정=구 ask단위 섀도
      KREAM_UNIFIED_BATCH: "1500"  # 사이클당 배치(로테이션). 1,500 + 90초 대기 ≈ 40분/전카탈로그 1회전
      KREAM_LOOP_SLEEP: "90"  # 사이클 간 대기(초). 사이클 자체가 수십초라 짧게 — 시세 추종용
      KREAM_SHADOW_EXECUTE: "1"  # [Step 5] 실행 전환 — 실제 크림 PATCH/POST/DELETE (로컬 정지·가드 검증 완료 2026-07-22)
      KREAM_EXEC_BOX: "1"  # [A] 박스(해외배송) 갱신/삭제 실행 — 섀도 검증 완료(175건 계산정확)
      KREAM_EXEC_SHOE: "1"  # [B] 신발(mm) 갱신/삭제 실행 — 실시간 사이즈시세 이식 후 섀도검증
                            # (247상품 100% 조회, 갱신198·삭제60, 샘플 전건 인상/삭제·인하 0)
      KREAM_WATCHDOG_STALL_SEC: "600"  # 루프 행 감시 — 5분 무진행 시 자동 재기동(반복 정지 대응)
      # [2026-08-01 임시차단] 신발/박스 신규등록 restock 이 매사이클 크림/스니덩크 API 대량조회 →
      # 소켓 압박으로 카드 갱신루프까지 행 유발 의심. 카드 루프 안정화 확인 후 재활성.
      KREAM_EXEC_SHOE_RESTOCK: "1"  # [B-2] 신발 신규 자동등록 — 임시 OFF(안정화 진단)
      KREAM_SHOE_RESTOCK_MAX: "50"  # 신발 신규등록 사이클당 상한(사이즈별 다건 폭주 방지)
      # [2026-08-02] 등록 병렬화(150건 51초)로 여유 생김 — 상한 150이 등록가능 742건을
      # 5사이클로 쪼개 리스톡 반영이 늦던 것 해소. 동시 6.
      # [2026-08-02] 신발 입찰이 7,200건+로 늘어 조회 상한 2,500에 막혀 보류가 199건까지
      # 급증(실시간 시세를 못 받은 입찰은 갱신·삭제 판단 자체를 못 한다). 병렬화로
      # 신발 단계가 264초까지 줄어 여유 생김 → 상한 상향.
      # [2026-08-03] 7000 → 18000(전량). 상한 7,000 이면 신발 18,217 중 6,654 만
      # 시세를 받아 63% 가 매 사이클 방치되고, 그대로 시장가가 움직여 2등이 됐다
      # (신발 1순위 12,015/17,908 = 67%, 카드는 95%).
      # 조회 총량은 같은데 사이클을 나눌수록 카드처리(약 7분) 고정비용이 반복된다 →
      # 전량 조회가 로테이션 한 바퀴 기준으로 오히려 빠르다(48분 → 38분 추정).
      KREAM_SHOE_FETCH_MAX: "18000"
      KREAM_POST_MAX: "1200"
      KREAM_POST_CONCURRENCY: "6"
      KREAM_EXEC_BOX_RESTOCK: "1"  # [B-3] 박스/카드팩 신규 자동등록 — 실행ON
                                   # [2026-08-03] 08-01 에 호출부가 지워져 실제로는 아무도 등록을
                                   # 안 하고 있었다(입찰 박스4·카드팩0). 전용 경로 재호출 + 후보를
                                   # 옵션명(1個/パック) 기준으로 교체 → 등록대상 164건(거래0 81 차단)
      KREAM_BOX_RESTOCK_MAX: "30"  # 박스 신규등록 사이클당 상한(첫등록 폭주 방지)
      # netns 공유 → api(8080)/worker(8081)/reconciler(8082)와 분리
      # [2026-08-02] 신발 ask 폭증(892→17,959)으로 사이클 정지 → 신규등록 일시중단, 조회 동시성↑.
      # 갱신 안정화 확인 후 KREAM_NONCARD_PRIORITY_MAX 를 200~500 으로 재개.
      KREAM_NONCARD_PRIORITY_MAX: "0"
      KREAM_SHOE_FETCH_CONCURRENCY: "30"
      KREAM_BIND_PORT: "8083"
      # 크림 루프는 반드시 돌아야 하므로 BG 비활성 금지 (0 고정)
      DISABLE_BACKGROUND_WORKERS: "0"
      # 풀 축소 — api(80)+worker(8×30=240)+reconciler(30)+kream(20)=370 < max_connections(400)
      DB_WRITE_POOL_SIZE: "10"
      DB_WRITE_MAX_OVERFLOW: "10"
      DB_READ_POOL_SIZE: "5"
      DB_READ_MAX_OVERFLOW: "5"

volumes:
  pg_data:
  caddy_data:
  caddy_config:

networks:
  samba-local:
